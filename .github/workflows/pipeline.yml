name: CI/CD Pipeline

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main", "dev"]

jobs:
  lint-frontend:
    name: Lint & Build (Frontend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "./frontend/package-lock.json"
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Run ESLint
        run: npm run lint
      - name: Build frontend
        run: npm run build

  lint-backend:
    name: Lint (Backend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "./backend/package-lock.json"
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Run ESLint
        run: npm run lint

  deploy-backend:
    name: Deploy → Render (Backend)
    runs-on: ubuntu-latest
    needs: [lint-frontend, lint-backend]
    if: github.ref == 'refs/heads/main'
    environment:
      name: Production (Backend)
      url: https://quill-green.vercel.app
    steps:
      - name: Trigger Render Backend Deploy
        run: |
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" -X POST "${{ secrets.RENDER_BACKEND_DEPLOY_HOOK_URL }}")
          if [ "$RESPONSE" -ge 200 ] && [ "$RESPONSE" -lt 300 ]; then
            echo "✅ Backend deploy triggered (HTTP $RESPONSE)"
          else
            echo "❌ Backend deploy hook returned HTTP $RESPONSE" && exit 1
          fi

  deploy-fastapi:
    name: Deploy → Render (FastAPI)
    runs-on: ubuntu-latest
    needs: [lint-frontend, lint-backend]
    if: github.ref == 'refs/heads/main'
    environment:
      name: Production (FastAPI)
      url: https://quill-green.vercel.app
    steps:
      - name: Trigger Render FastAPI Deploy
        run: |
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" -X POST "${{ secrets.RENDER_FASTAPI_DEPLOY_HOOK_URL }}")
          if [ "$RESPONSE" -ge 200 ] && [ "$RESPONSE" -lt 300 ]; then
            echo "✅ FastAPI deploy triggered (HTTP $RESPONSE)"
          else
            echo "❌ FastAPI deploy hook returned HTTP $RESPONSE" && exit 1
          fi
