services:
  - type: web
    name: notes-app-backend
    runtime: node
    region: oregon
    plan: free
    rootDir: backend
    # Exactly the committed lockfile, as CI installs it (WORKSPACE.md: peer ranges need the flag)
    buildCommand: "npm ci --legacy-peer-deps"
    startCommand: "npm start"
    healthCheckPath: "/ready"
    # Deploys come from CI's deploy hook, after lint and checks pass
    autoDeploy: false
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: FASTAPI_SUMMARIZE_URL
        sync: false
      - key: FASTAPI_INTERNAL_KEY
        sync: false
      - key: ACCESS_TOKEN_SECRET
        sync: false
      - key: NODE_ENV
        value: production
      - key: FRONTEND_ORIGIN
        sync: false
      - key: ACCESS_TOKEN_TTL
        value: 15m
      - key: REFRESH_TOKEN_TTL_DAYS
        value: "30"
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
      - key: MONGO_URI
        sync: false

  - type: web
    name: fast-api-service
    runtime: python
    region: oregon
    plan: free
    rootDir: fast_api
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    # Liveness only: /ready also asks Qdrant, and a Qdrant hiccup must not get the whole AI
    # service (summaries included) restarted
    healthCheckPath: "/health"
    autoDeploy: false
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.11"
      # The backend's public URL (no /v1, no trailing slash): every agent tool call goes there
      - key: EXPRESS_INTERNAL_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: FASTAPI_INTERNAL_KEY
        sync: false
