# The whole stack locally, the same way as the three dev servers: frontend http://localhost:5173,
# Express :8000, FastAPI :8001. Settings come from each service's own .env (backend/.env,
# fast_api/.env, frontend/.env); only the addresses between containers are set here.
#   docker compose up --build
services:
  backend:
    build:
      context: ./backend
      target: development
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    env_file: ./backend/.env
    environment:
      - NODE_ENV=development
      - PORT=8000
      - FASTAPI_SUMMARIZE_URL=http://fast_api:8001
    depends_on:
      - fast_api

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - API_PROXY_TARGET=http://backend:8000
    depends_on:
      - backend

  fast_api:
    build:
      context: ./fast_api
    ports:
      - "8001:8001"
    volumes:
      - ./fast_api:/app
      # the host's Windows venv is useless in the Linux container; keep the image's own packages
      - /app/venv
    env_file: ./fast_api/.env
    environment:
      - EXPRESS_INTERNAL_URL=http://backend:8000
    command: [ "uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8001", "--reload" ]
